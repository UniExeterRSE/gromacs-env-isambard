# GROMACS environment — "spack" stack: build the dependency stack from source.
# MPI is a from-source MPICH and FFTW is built by Spack. Selected by
# GROMACS_STACK=spack; scripts/lib.sh loads NO Cray PE modules for this stack
# (the gcc@14.3.0 external is the system /usr/bin/gcc-14, always present).
#
# This is the portability/comparison stack against the default cray one
# (../cray/spack.yaml). It SHARES the install tree ($PREFIX/opt) with it, so the
# MPI/FFT-independent subtree (openblas, hwloc, cmake, ...) is built once.
#
# ONE system library is still declared external here, and it is not a shortcut:
#   libfabric  the Slingshot CXI provider is closed-source HPE hardware support
#              that simply does not exist in a from-source libfabric. Without it
#              a from-source MPICH cannot use the interconnect at all, and the
#              multi-node half of the benchmark would be meaningless.
#
# PMIx is NOT external here, and that is a deliberate reversal. The system PMIx
# (4.2.6) looks like the safe choice — it is what Slurm's mpi_pmix_v4 server
# plugin is built against — but it cannot be linked against: its libtool archive
# declares `dependency_libs = ... -levent_core -levent_pthreads`, and this system
# has libevent's runtime .so.N but no -devel symlinks, so MPICH fails to link
# with "cannot find -levent_core". Spack builds PMIx and its libevent instead.
# Client/server version skew is fine by design here: cross-version
# interoperability between a PMIx client and a PMIx server is an explicit
# guarantee of the PMIx standard, which is the whole reason PMIx exists.
# Everything genuinely comparable — the MPI implementation and the FFT library —
# is from source.
spack:
  # view: false, deliberately. A Spack view is a merged symlink tree, and it
  # cannot hold BOTH gromacs specs: `gromacs~mpi` and `gromacs+mpi` differ only
  # by a variant, so Spack projects them to the same prefix and refuses to build
  # the view ("the following two specs project to the same prefix").
  #
  # Custom projections would separate them but then there is no merged bin/ to
  # put on PATH, which was the only reason to want a view. So there is no view:
  # the modulefile composes PATH/LD_LIBRARY_PATH/CMAKE_PREFIX_PATH from the two
  # GROMACS install prefixes directly (scripts/gromacs-env.lua). That is also
  # strictly more correct — each binary is invoked through its own prefix, so
  # GROMACS resolves its own share/gromacs data dir unambiguously, and
  # CMAKE_PREFIX_PATH/pkgconfig point at real GROMACS installs rather than a
  # merged tree. Everything else in the environment is a dependency that Spack
  # has already RPATH'd into the binaries.
  view: false
  include:
  - ../common.yaml
  - ./simd.yaml
  packages:
    all:
      providers:
        mpi: [mpich]
        fftw-api: [fftw]
    # device=ch4 netmod=ofi + the system libfabric = the same transport path
    # cray-mpich takes (CXI over Slingshot), so the comparison isolates the MPI
    # implementation rather than the fabric.
    #
    # pmi=pmix, NOT pmi=pmi2. The obvious choice, `pmi=pmi2` with
    # `srun --mpi=pmi2`, does not work here: MPICH 5's PMI2 client sends a
    # `fullinit` without the `pmijobid` field that Slurm 23.02's mpi_pmi2 plugin
    # requires, so every rank dies in MPI_Init_thread with
    #   slurmstepd: error: pmijobid missing in fullinit command
    #   pmi2_init(21): PMI_Init returned -1
    # PMIx is the supported path on this Slurm (it ships mpi_pmix_v4.so), and
    # `pmi=pmix` conflicts with +hydra in the Spack package, hence ~hydra: this
    # MPICH has no `mpiexec` of its own and is launched only by srun. That is no
    # loss here — srun is the launcher on this machine either way, and the
    # modulefile exports the right one per stack as $GROMACS_MPI_LAUNCHER so
    # callers never have to know any of this.
    mpich:
      require: ['device=ch4 netmod=ofi pmi=pmix ~hydra +romio ~fortran']
    # Pinned to 4.2.x, matching the PMIx generation Slurm's own mpi_pmix_v4
    # server plugin is built against (4.2.6 here). Two reasons, both found the
    # hard way:
    #   - Spack's default (6.1.0 at this pin) aborts every MPI process at
    #     startup with
    #       hwloc_components_fini: Assertion `0 != hwloc_components_users' failed
    #     against hwloc 2.13 — an unbalanced hwloc init/fini in a very new PMIx.
    #   - client/server skew is supported by the PMIx standard, but there is no
    #     reason to lean on it across four major versions when matching the
    #     server costs nothing.
    pmix:
      require: ['@4.2.6']
    libfabric:
      buildable: false
      externals:
      - spec: libfabric@2.3.1 fabrics=cxi
        prefix: /opt/cray/libfabric/2.3.1
    # From-source FFTW, pinned to the same upstream version the cray stack
    # externalizes (HPE's 3.3.10.7 == upstream 3.3.10) so the two stacks differ
    # in how FFTW was BUILT, not in which FFTW. precision=float is what GROMACS
    # mixed precision actually calls; double is included so the same module can
    # serve a +double GROMACS or other FFTW users later.
    fftw:
      require: ['@3.3.10 precision=float,double +openmp ~mpi']
  specs:
  # Same two binaries as the cray stack — see ../cray/spack.yaml.
  - gromacs ~mpi
  - gromacs +mpi
